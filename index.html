<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensagem secreta</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #101827; color: #f8fafc; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 400px; }
    h1 { margin: 0 0 8px; font-size: 24px; text-align: center; }
    .hint { margin: 0; font-size: 14px; text-align: center; color: #cbd5e1; }
    form { display: grid; gap: 16px; }
    input, button { width: 100%; min-height: 52px; border-radius: 12px; font: inherit; font-size: 16px; padding: 14px 16px; }
    input { border: 1px solid #64748b; background: #1e293b; color: #fff; }
    button { border: 0; background: #a5b4fc; color: #101827; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid #c7d2fe; outline-offset: 3px; }
    #status { color: #fecaca; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <form id="anniversary-form">
      <label for="anniversary">Nosso aniversário de namoro:</label>
      <input id="anniversary" type="text" inputmode="numeric" placeholder="DD/MM/AAAA" autocomplete="off" maxlength="10" required>
      <button type="submit">Continuar</button>
    </form>
    <form id="form" hidden>
      <input id="password" type="password" aria-label="Senha" aria-describedby="hint" placeholder="Senha" autocomplete="current-password" required>
      <p id="hint" class="hint">A senha é OMNIA VINCIT AMOR</p>
      <button id="open" type="submit">Abrir mensagem</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="message" role="region" aria-label="Mensagem" aria-live="polite" hidden></div>
  </main>
  <script>
    'use strict';
    const SALT = 'Du/6/6inMpmqTJN89+uctQ==';
    const NONCE = '1WLzxwapNORs5g7N';
    const CIPHERTEXT = 'SR1CL4wQkJ77Dp7teiAOLTj7cbyq8CxNvnb9eDT2yV2ISWHzUgwpNGKrlX8y2jPcjoqz4pvI9iTl0P7nTbV0acoOwtmN+dILiAJ/R9qrVewXkXIrUYbozLzoKKTXeVlIl2+8U0P5fQbJastL9TxP/fevw4+hQnRxd6Em5DJXOXj30mowk974FS7km0oaPgelkstIfwwkdKsJENhZEUk+bvULvJP5HC+iFuCCgEsqUwxeCPtji97n9bOGprFscxBnyNcZ9+hkriQko937ejukYlhFlzP6tlq98jLcPyxFYMin9eZkoK2EkGCu1VYwXUx0W1Bk2s1hEgR0uXIJWGyUVSwVxMpBp6kKtm/ecnP+Ues0dIdSaClmTW+Im2e1Ka71i+pjfm0+DV1P6Dw3/+2DK5mH/8vfQ//J7gAU9pyvU2vWszkqHL/HRZYGhPLWIh88+ldVCvsva5OmecOaJpUhZda69Z2lUf3ECngfb4LK8kh1WIPPsGeqC3dfACGzh6sgU9unZaxS+JykK9t5EBobVUnlU5V8zDb5KK5ggQOX3lJwJYkSZ89MZIxHK2WVJU4wXW5EYjoB6zcX8/oxmFzencfcdKy6nThqcQ/M7v+o6kAjpyEGXcwsg0oFbx4CEG1A1jJI+bHYNjLJOwqC0mJlLCLr+6i2lVtPTZcBIlVg62v1rCxMho7pPNJbVzaxVW/PXPmVD1RqQg0Mo/wn0ijZJYNMGdj8ydKBxDvBIvg1IvavBQc4Nq20tvb2ppM3Y4ysHFJavcabDz1NKMs956aisVxpHBKxF6QP9SjdyGxKPco3TRj3M3RU69ug+/YnNL5BTIJikr5lmLUM2zfSPnFkumK0biAtZLDn1ijnUTBV1ywr3KZE+L+jEOuTi1DoslCl2LJ0fjqSDAAorG7D5pJ03jpQiGfaPTCerlxXhcHpi73OCtwF5cAGpW9kD/Ki1uakVYLcqS3N5t3VflRL3YX7ey3/tdKYplTLT1X06CXw6OwMGk5z1Y1JZb0t+cI0Ivv/lZ58/24D/irKGifwBMd6+Oj50uBFAz9YIC1r95E2QP3DEVVYjMgxxCf/hQeWbJLXoxRR+vfc4kezy14cyuLgF5//6FMJPjA34k09FW39vBk8eg/o/GHa1Ni8P5+8WnH/C72Bhd0v6z9YCtjZ/jviH8nuWOEMmL/eehZphUzG/XRFVnrR1bLYfWi8FcUEvgezRn6lTf27tSRnooo7mA==';
    const form = document.getElementById('form');
    const password = document.getElementById('password');
    const button = document.getElementById('open');
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const anniversaryForm = document.getElementById('anniversary-form');
    const anniversary = document.getElementById('anniversary');
    anniversary.addEventListener('input', () => {
      const digits = anniversary.value.replace(/\D/g, '').slice(0, 8);
      anniversary.value = digits.replace(/^(\d{2})(\d)/, '$1/$2').replace(/^(\d{2}\/\d{2})(\d)/, '$1/$2');
      status.textContent = '';
    });
    anniversaryForm.addEventListener('submit', event => {
      event.preventDefault();
      if (anniversary.value !== '22/08/2026') {
        status.textContent = 'Data incorreta';
        return;
      }
      status.textContent = '';
      anniversaryForm.hidden = true;
      form.hidden = false;
      password.focus();
    });
    function decodeBase64(value) {
      return Uint8Array.from(atob(value), character => character.charCodeAt(0));
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      status.textContent = '';
      message.textContent = '';
      message.hidden = true;
      button.disabled = true;
      password.disabled = true;
      try {
        if (!window.isSecureContext || !window.crypto?.subtle) {
          status.textContent = 'Abra esta página usando HTTPS para revelar a mensagem.';
          return;
        }
        const keyMaterial = await crypto.subtle.importKey(
          'raw', new TextEncoder().encode(password.value), 'PBKDF2', false, ['deriveKey']
        );
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: decodeBase64(SALT), iterations: 600000, hash: 'SHA-256' },
          keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        const plaintext = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: decodeBase64(NONCE), tagLength: 128 },
          key, decodeBase64(CIPHERTEXT)
        );
        message.textContent = new TextDecoder('utf-8', { fatal: true }).decode(plaintext);
        message.hidden = false;
        password.value = '';
      } catch {
        status.textContent = 'Senha incorreta';
      } finally {
        button.disabled = false;
        password.disabled = false;
      }
    });
  </script>
</body>
</html>
