<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nosso aniversário de namoro</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #101827; color: #f8fafc; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 400px; }
    form { display: grid; gap: 20px; }
    label { font-size: 24px; font-weight: 700; text-align: center; }
    input { width: 100%; min-height: 52px; border: 1px solid #64748b; border-radius: 12px; padding: 14px 16px; background: #1e293b; color: #fff; font: inherit; font-size: 16px; text-align: center; }
    :focus-visible { outline: 3px solid #c7d2fe; outline-offset: 3px; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; padding: 14px 16px; background: #a5b4fc; color: #101827; font: inherit; font-weight: 700; cursor: pointer; }
    #error { margin: 0; color: #fecaca; text-align: center; }
    #result { margin: 0; font-size: 24px; line-height: 1.5; text-align: center; }
    #copy { margin-top: 20px; }
    #copy-status { text-align: center; color: #c7d2fe; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <form id="form">
      <label for="anniversary">Nosso aniversário de namoro</label>
      <input id="anniversary" type="text" inputmode="numeric" placeholder="DD/MM/AAAA" aria-label="Data do nosso aniversário de namoro" autocomplete="off" maxlength="10" enterkeyhint="go" required>
      <button type="submit">Enter</button>
      <p id="error" role="status" aria-live="polite"></p>
    </form>
    <p id="result" role="status" aria-live="polite" hidden></p>
    <button id="copy" type="button" hidden>Copiar</button>
    <p id="copy-status" role="status" aria-live="polite" hidden></p>
  </main>
  <script>
    'use strict';
    const form = document.getElementById('form');
    const date = document.getElementById('anniversary');
    const error = document.getElementById('error');
    const result = document.getElementById('result');
    const copy = document.getElementById('copy');
    const copyStatus = document.getElementById('copy-status');
    copy.addEventListener('click', async () => {
      copyStatus.hidden = false;
      try {
        await navigator.clipboard.writeText('OMNIA VINCIT AMOR');
        copyStatus.textContent = 'Copiado!';
      } catch {
        copyStatus.textContent = 'Não foi possível copiar. Selecione a frase e copie manualmente.';
      }
    });
    function revealIfCorrect() {
      if (date.value !== '22/08/2026') return false;
      form.hidden = true;
      result.textContent = 'A senha é OMNIA VINCIT AMOR';
      result.hidden = false;
      copy.hidden = false;
      return true;
    }
    date.addEventListener('input', () => {
      const digits = date.value.replace(/\D/g, '').slice(0, 8);
      date.value = digits.replace(/^(\d{2})(\d)/, '$1/$2').replace(/^(\d{2}\/\d{2})(\d)/, '$1/$2');
      error.textContent = '';
      revealIfCorrect();
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (!revealIfCorrect()) {
        error.textContent = 'Data incorreta';
        return;
      }
    });
  </script>
</body>
</html>
